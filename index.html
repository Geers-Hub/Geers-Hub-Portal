<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Serviceware Knowledge Widget Test</title>

  <script
    async
    src="https://tele.knowledge.serviceware.cloud/sabio/services/widget/loader/?id=sw-knowledge-loader&token=iTKyOA%2B%2BB4hNGa9m03cFf7RBdjLGCJWF99Br%2BHOHbh9m3U%2Ff6vtYZPnY7%2BQPqink0EuJg1ftPsCLnccRSPMdDUyeDZjoUNrAGes2FoUrzpY%3D">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* 🔥 Gesamt-Layout zentriert */
    .page-wrapper {
      display: flex;
      justify-content: center;   /* zentriert alles */
    }

    /* 🔥 2-Spalten Container */
    .grid {
      display: flex;
      gap: 40px;                /* Abstand zwischen den Spalten */
      align-items: flex-start;
    }

    /* 🔥 Jede Spalte */
    .column {
      width: 564px;
    }

    /* 🔲 Widget Box (dein Kasten) */
    .widget-box {
      width: 564px;
      max-height: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      background: #fff;

      display: flex;
      flex-direction: column;
    }

    .search-area {
      flex: 0 0 auto;
      margin-bottom: 12px;
    }

    .detail-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    sw-knowledge-search,
    sw-knowledge-detail {
      display: block;
    }

    /* rechte Spalte nur Platzhalter */
    .placeholder {
      width: 564px;
      height: 600px;
      border: 1px dashed #bbb;
      border-radius: 8px;
      background: #fafafa;
    }
  </style>
</head>

<body>

  <h1>Serviceware Knowledge – Widget Layout Test</h1>

  <div class="page-wrapper">
    <div class="grid">

      <!-- 🔵 LINKE SPALTE -->
      <div class="column">

        <div class="widget-box">

          <div class="search-area">
            <sw-knowledge-search
              group="0"
              react-on-events="true"
              use-api-key-connection="true">
            </sw-knowledge-search>
          </div>

          <div class="detail-area">
            <sw-knowledge-detail
              group="0"
              react-on-events="true"
              use-api-key-connection="true">
            </sw-knowledge-detail>
          </div>

        </div>

      </div>

      <!-- ⚪ RECHTE SPALTE (später zweite Widgets) -->
      <div class="column">
        <div class="placeholder"></div>
      </div>

    </div>
  </div>

</body>
</html>
