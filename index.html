<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Serviceware Knowledge Widget Test</title>

  <script async src="https://geers.sabio.de/sabio/services/widget/loader/?id=sw-knowledge-loader&token=muTHlUqFzcJK82ZNRyfbDxTvhNV7wDHTYa9jYDJqzWVVrkDnFIcu62E31tZ7EWrlVRPBPn1I2%2B41aaXSX5FRs0pOFpQYdJmABL8JmUr1KQk%3D"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .page-wrapper {
      display: flex;
      justify-content: center;   /* zentrieren */
    }

    .grid {
      display: flex;
      gap: 20px;                /* Abstand zwischen den Spalten */
      align-items: flex-start;
    }

    .column {
      width: 564px;
    }

    /* Widget Box*/
    .widget-box {
      width: 564px;
      height: 1600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      background: #fff;

      display: flex;
      flex-direction: column;
    }

    .search-area {
      flex: 0 0 auto;
      margin-bottom: 12px;
    }

    .detail-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    sw-knowledge-search,
    sw-knowledge-detail {
      display: block;
    }

    /* Platzhalter rechts*/
    .placeholder {
      width: 564px;
      height: 600px;
      border: 1px dashed #bbb;
      border-radius: 8px;
      background: #fafafa;
    }
  </style>
</head>

<body>

  <h1>Serviceware Knowledge – Widget Layout Test</h1>

  <div class="page-wrapper">
    <div class="grid">

      <!-- Linke Spalte -->
      <div class="column">

        <div class="widget-box">

          <div class="search-area">
            <sw-knowledge-search
             group="0"
             react-on-events="true"
             allow-config-edit="false"
             raise-events="true"
             support-browser-history="true"
             auto-dialog="false"
             dialog-size="auto"
             use-api-key-connection="true"
             readonly="false"
             show-suggestions="false"
             suggestion-mode="text"
             open-selected-suggestion-as-text="false"
             suggestion-min-chars="0"
             max-suggestions="10"
             debounce="600"
             search-provider="default"
             limit="null"
             visible="true"
             filter="[]"
             leading-filters="false"
             view-mode="default"
            </sw-knowledge-search>
          </div>

          <div class="search-area">

          <sw-knowledge-answer group="0" react-on-events="true" allow-config-edit="false" raise-events="true" support-browser-history="true" auto-dialog="false" dialog-size="auto" use-api-key-connection="true" readonly="false" header="Answer" show-sources="true" min-words="3" min-chars="10" specific-text-ids="[]"> </sw-knowledge-answer>
          </div>
          <div class="detail-area">
            <sw-knowledge-detail
            group="0"
            react-on-events="true"
            allow-config-edit="false"
            raise-events="true"
            support-browser-history="true"
            auto-dialog="false"
            dialog-size="auto"
            use-api-key-connection="true"
            readonly="false"
            initial-text-ids="[]"
            single-expand="false"
            expandable="true"
            expanded="true"
            hide-title="false"
            auto-expand-foldouts="false"
            show-path="true"
            show-attachments="true"
            show-attachments-as-menu="false"
            load-styles="true"
            highlight="true"
            view-mode="default"
            use-auth-token-for-documents="false"
            check-host-for-internal-links="true"
            link-fallback="false"
            allow-rating="false"
            rating-label="defaultRatingLabel"
            use-navigation="false"
            param-name="articleId"
            allow-share-on-text="false"
            allow-share-all="false"
            share-targets='["facebook","twitter","mail","copyToClipboard"]'>
            </sw-knowledge-detail>
          </div>

        </div>

      </div>

      <!-- Rechte Spalte -->
      <div class="column">
        <div class="placeholder"></div>
      </div>

    </div>
  </div>

  
  <script>
  async function login() {

    const password = document.getElementById("pw").value;

    const res = await fetch("/.netlify/functions/login", {
      method: "POST",
      body: JSON.stringify({ password })
    });

    if (res.ok) {
      localStorage.setItem("auth", "true");
      window.location.href = "/app.html";
    } else {
      alert("Falsches Passwort");
    }
  }
  </script>


  
</body>
</html>
