<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Serviceware Knowledge Widget Test</title>

  <!-- Serviceware Knowledge Loader -->
  <script
    async
    src="https://tele.knowledge.serviceware.cloud/sabio/services/widget/loader/?id=sw-knowledge-loader&token=iTKyOA%2B%2BB4hNGa9m03cFf7RBdjLGCJWF99Br%2BHOHbh9m3U%2Ff6vtYZPnY7%2BQPqink0EuJg1ftPsCLnccRSPMdDUyeDZjoUNrAGes2FoUrzpY%3D">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* 🔲 Kasten */
    .widget-box {
      width: 564px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      background: #fff;
    }

    /* Abstand zwischen Widgets */
    sw-knowledge-search {
      display: block;
      margin-bottom: 16px;
    }

    sw-knowledge-detail {
      display: block;
    }
  </style>
</head>

<body>

  <h1>Serviceware Knowledge – Widget Testseite</h1>

  <div class="widget-box">

    <sw-knowledge-search
      group="0"
      react-on-events="true"
      allow-config-edit="false"
      raise-events="true"
      support-browser-history="true"
      auto-dialog="false"
      dialog-size="auto"
      use-api-key-connection="true"
      readonly="false"
      show-suggestions="true"
      suggestion-mode="text"
      open-selected-suggestion-as-text="false"
      suggestion-min-chars="0"
      max-suggestions="10"
      debounce="600"
      search-provider="default"
      limit="null"
      visible="true"
      filter="[]"
      leading-filters="false"
      view-mode="default">
    </sw-knowledge-search>

    <sw-knowledge-detail
      group="0"
      react-on-events="true"
      allow-config-edit="false"
      raise-events="true"
      support-browser-history="true"
      auto-dialog="false"
      dialog-size="auto"
      use-api-key-connection="true"
      readonly="false"
      initial-text-ids="[]"
      single-expand="false"
      expandable="true"
      expanded="true"
      hide-title="false"
      auto-expand-foldouts="false"
      show-path="true"
      show-attachments="true"
      show-attachments-as-menu="false"
      load-styles="true"
      highlight="true"
      view-mode="default"
      use-auth-token-for-documents="false"
      check-host-for-internal-links="true"
      link-fallback="false"
      allow-rating="false"
      rating-label="defaultRatingLabel"
      use-navigation="false"
      param-name="articleId"
      allow-share-on-text="false"
      allow-share-all="false"
      share-targets='["facebook","twitter","mail","copyToClipboard"]'>
    </sw-knowledge-detail>

  </div>

</body>
</html>
